  </g></g>
  <g transform="translate(0 49)"><g fill="#d8cde5" stroke="#6a3d9a" stroke-width="1.3" id="g101">
    <rect x="-5.5" y="-5.5" width="11" height="11" transform="translate(870 198) rotate(45)" id="rect98" />
    <rect x="-5.5" y="-5.5" width="11" height="11" transform="translate(914 232) rotate(45)" id="rect99" />
