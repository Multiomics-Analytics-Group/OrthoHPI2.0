    <line x1="870" y1="198" x2="888" y2="176" stroke-width="2.80" id="line69" />
    <line x1="870" y1="198" x2="860" y2="222" stroke-width="1.36" id="line70" />
    <line x1="870" y1="198" x2="892" y2="214" stroke-width="2.64" id="line71" />
    <line x1="914" y1="232" x2="892" y2="214" stroke-width="1.84" id="line72" />
    <line x1="914" y1="232" x2="938" y2="220" stroke-width="3.36" id="line73" />
    <line x1="914" y1="232" x2="934" y2="254" stroke-width="1.52" id="line74" />
    <line x1="914" y1="232" x2="906" y2="258" stroke-width="2.40" id="line75" />
    <line x1="914" y1="232" x2="930" y2="200" stroke-width="2.00" id="line76" />
    <line x1="946" y1="176" x2="930" y2="200" stroke-width="2.96" id="line77" />
    <line x1="946" y1="176" x2="962" y2="156" stroke-width="1.68" id="line78" />
    <line x1="946" y1="176" x2="968" y2="190" stroke-width="2.32" id="line79" />
    <line x1="946" y1="176" x2="938" y2="150" stroke-width="1.28" id="line80" />
    <line x1="872" y1="286" x2="850" y2="274" stroke-width="3.52" id="line81" />
