<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- the same vis-network 9.1.2 pyvis draws with, served next to this file rather
         than fetched from a CDN: the network is the page, so it should not stop working
         where cdnjs is unreachable, and the version cannot drift under us -->
    <script src="./vis-network.min.js"></script>
    <style>
      /* the one rule of vis-network.css the network needs, copied from it verbatim:
         the tooltip that shows the protein names and identifiers on hover. The rest of
         that stylesheet is 220 kB of timeline and manipulation widgets. */
      div.vis-tooltip {
        background-color: #ffffff;
        border: 1px solid #d8dee6;
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(15, 40, 70, 0.14);
        color: #1f2937;
        font-family: 'Source Sans Pro', -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1.45;
        padding: 8px 10px;
        pointer-events: none;
        position: absolute;
        visibility: hidden;
        white-space: nowrap;
        z-index: 5;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #mynetwork {
        width: 100%;
        /* a barely-there tint rather than white: it separates the network from the
           page around it without a hard frame, and the nodes read warmer on it */
        background-color: #fbfcfd;
        border: 1px solid #e4e8ee;
        border-radius: 8px;
        box-sizing: border-box;
      }
      /* the pointer is the only hint that the edges can be clicked */
      #mynetwork canvas {
        cursor: default;
      }
      /* over the network while vis.js lays it out, which for the largest networks takes
         several seconds with nothing drawn */
      #loading {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Source Sans Pro', -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        color: #6b7785;
        pointer-events: none;
      }
      #loading[hidden] {
        display: none;
      }
      /* the button that expands the network over the whole window, shown in the corner
         while the pointer is over the network, as on the figures */
      #expand {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.85);
        color: #6b7785;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #frame:hover #expand,
      #expand:focus-visible,
      body.expanded #expand {
        opacity: 1;
      }
      #expand:hover {
        color: #1f2937;
        background: #eef1f5;
      }
      #expand .collapse,
      body.expanded #expand .enlarge {
        display: none;
      }
      body.expanded #expand .collapse {
        display: block;
      }
      body.expanded {
        background-color: #ffffff;
      }
      #unavailable {
        font-family: sans-serif;
        color: #555555;
        padding: 1em;
      }
    </style>
  </head>

  <body>
    <div id="frame" style="position: relative">
      <div id="mynetwork"></div>
      <div id="loading">Loading network…</div>
      <button id="expand" type="button" title="Expand" hidden>
        <svg class="enlarge" width="16" height="16" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" />
        </svg>
        <svg class="collapse" width="16" height="16" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" />
        </svg>
      </button>
    </div>
    <div id="unavailable" hidden>
      The network could not be drawn: vis-network.min.js did not load.
    </div>

    <script>
      (function () {
        var container = document.getElementById('mynetwork');
        var unavailable = document.getElementById('unavailable');
        var loading = document.getElementById('loading');
        var expandButton = document.getElementById('expand');
        // the iframe the network is drawn in, which is served from the same origin as the
        // page and so can be laid over it
        var iframe = null;
        try {
          iframe = window.frameElement;
        } catch (e) {}
        var network = null;
        // the graph the network currently shows. Streamlit re-fires the render event on
        // every rerun of the page -- moving the confidence slider, paging the table,
        // closing the dialog -- and rebuilding the network on each of those would
        // restart the physics and throw away the pan and zoom the user had set up.
        var drawnGraph = null;
        var frameHeight = null;
        // the height the page gives the network, which it returns to on collapsing
        var pageHeight = 600;
        var clickable = true;
        // the iframe's own style, put back on collapsing
        var pageStyle = null;

        function isExpanded() {
          return pageStyle !== null;
        }

        // lays the iframe over the whole window, as streamlit does for the figures, and
        // zooms the network to fill whichever space it has
        function setExpanded(expand) {
          if (expand === isExpanded()) {
            return;
          }
          if (expand) {
            pageStyle = iframe.style.cssText;
            iframe.style.cssText = pageStyle + ';position: fixed; inset: 0; width: 100vw;'
              + 'height: 100vh; z-index: 1000000; background: #ffffff;';
          } else {
            iframe.style.cssText = pageStyle;
            pageStyle = null;
          }
          document.body.classList.toggle('expanded', expand);
          expandButton.title = expand ? 'Close' : 'Expand';
          container.style.height = expand ? '100vh' : pageHeight + 'px';
          if (network !== null) {
            network.redraw();
            fitNetwork(network);
          }
        }

        function onKey(event) {
          if (event.key === 'Escape') {
            setExpanded(false);
          }
        }

        function send(type, data) {
          data = data || {};
          data.isStreamlitMessage = true;
          data.type = type;
          window.parent.postMessage(data, '*');
        }

        function setFrameHeight(height) {
          if (height !== frameHeight) {
            frameHeight = height;
            send('streamlit:setFrameHeight', { height: height });
          }
        }

        function setComponentValue(value) {
          send('streamlit:setComponentValue', { value: value, dataType: 'json' });
        }

        function onClick(params) {
          // a click that landed on a node is a node click, even if an edge passes under it
          if (params.nodes.length > 0) {
            return;
          }
          // getEdgeAt is more forgiving than the selectEdge event: the edges are drawn
          // about a pixel wide, which is close to unclickable when hit exactly
          var edgeId = network.getEdgeAt(params.pointer.DOM);
          if (edgeId === undefined || edgeId === null) {
            return;
          }
          var edge = network.body.data.edges.get(edgeId);
          if (!edge) {
            return;
          }
          // the structures open on the page, under an expanded network
          setExpanded(false);
          // the timestamp is what tells one click from the next: without it, clicking
          // the same edge twice sends an identical value, Streamlit does not rerun and
          // the structures never reopen
          setComponentValue({ nonce: Date.now(), edge: edge });
        }

        function onHover() {
          container.querySelector('canvas').style.cursor = 'pointer';
        }

        function onBlur() {
          container.querySelector('canvas').style.cursor = 'default';
        }

        // room left around the network for the things the node positions do not account
        // for: the nodes have a radius, and the protein names stick out beyond it. Kept
        // small, because every pixel of it is paid for by zooming the network out, which
        // shrinks the protein names along with everything else
        var FIT_PADDING = 70;
        // a network of five proteins would otherwise be blown up until they filled the
        // canvas. vis' own fit() stops at 1, which leaves the small networks -- most of
        // them -- as a clump in the middle instead
        var MAX_FIT_SCALE = 1.35;

        // vis.js leaves the network wherever the physics put it, which is a clump in the
        // middle of whatever canvas it was given. Zooming to the extent of the nodes once
        // they have settled is what makes the network fill the space instead.
        function fitWhenSettled(net) {
          var fitted = false;

          function fit() {
            // the timeout can outlive the network it was set up for, and moving one that
            // has been destroyed throws
            if (fitted || network !== net) {
              return;
            }
            fitted = true;
            fitNetwork(net);
          }

          net.once('stabilizationIterationsDone', fit);
          // physics can be switched off, in which case the event above never fires
          setTimeout(fit, 4000);
        }

        // zooms to the extent of the nodes, within the box the network has now
        function fitNetwork(net) {
          var positions = net.getPositions();
          var ids = Object.keys(positions);
          if (ids.length === 0) {
            return;
          }
          var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          ids.forEach(function (id) {
            var p = positions[id];
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y);
            maxY = Math.max(maxY, p.y);
          });

          var box = container.getBoundingClientRect();
          var scale = Math.min(
            Math.max(box.width - FIT_PADDING, 100) / Math.max(maxX - minX, 1),
            Math.max(box.height - FIT_PADDING, 100) / Math.max(maxY - minY, 1)
          );
          net.moveTo({
            position: { x: (minX + maxX) / 2, y: (minY + maxY) / 2 },
            scale: Math.max(0.12, Math.min(scale, MAX_FIT_SCALE)),
            animation: false
          });
        }

        // vis.js draws nothing until the physics has settled, so the box says how far it
        // has got instead of standing empty
        function showLoading(net, options) {
          var physics = (options || {}).physics || {};
          var stabilization = physics.stabilization;
          if (physics.enabled === false || stabilization === false
              || (stabilization && stabilization.enabled === false)) {
            loading.hidden = true;
            return;
          }
          loading.textContent = 'Loading network…';
          loading.hidden = false;
          net.on('stabilizationProgress', function (params) {
            loading.textContent = 'Loading network… '
              + Math.round(100 * params.iterations / params.total) + '%';
          });
          net.once('stabilizationIterationsDone', function () {
            loading.hidden = true;
          });
        }

        function onRender(event) {
          if (!event.data || event.data.type !== 'streamlit:render') {
            return;
          }
          var args = event.data.args;
          var height = args.height || 600;
          pageHeight = height;
          clickable = args.clickable !== false;
          if (!isExpanded()) {
            container.style.height = height + 'px';
          }
          setFrameHeight(height + 4);

          if (typeof vis === 'undefined') {
            loading.hidden = true;
            container.hidden = true;
            unavailable.hidden = false;
            setFrameHeight(80);
            return;
          }

          var graph = JSON.stringify([args.nodes, args.edges, args.options]);
          if (graph === drawnGraph) {
            return;
          }
          drawnGraph = graph;

          if (network !== null) {
            network.destroy();
          }
          network = new vis.Network(
            container,
            { nodes: new vis.DataSet(args.nodes), edges: new vis.DataSet(args.edges) },
            args.options
          );
          showLoading(network, args.options);
          if (clickable) {
            network.on('click', onClick);
            // only the edges open anything, so only they get the pointer
            network.on('hoverEdge', onHover);
            network.on('blurEdge', onBlur);
          }
          expandButton.hidden = iframe === null;
          fitWhenSettled(network);
        }

        expandButton.addEventListener('click', function () {
          setExpanded(!isExpanded());
        });
        // Esc closes it wherever the focus is, in the network or on the page
        document.addEventListener('keydown', onKey);
        if (iframe !== null) {
          window.parent.document.addEventListener('keydown', onKey);
        }
        window.addEventListener('message', onRender);
        send('streamlit:componentReady', { apiVersion: 1 });
      })();
    </script>
  </body>
</html>
