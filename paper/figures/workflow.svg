<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="636" viewBox="0 0 800 636"
     font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box   { fill: #f4f4f4; stroke: #333; stroke-width: 1.2; rx: 6; }
    .filt  { fill: #e9f0f8; stroke: #3d5a80; stroke-width: 1.2; rx: 6; }
    .out   { fill: #e6f3e8; stroke: #2f6b3a; stroke-width: 1.2; rx: 6; }
    .line  { fill: none; stroke: #333; stroke-width: 1.4; }
    .arrow { fill: none; stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
    .title { font-weight: bold; font-size: 14px; text-anchor: middle; }
    .txt   { font-size: 12px; text-anchor: middle; }
    .col   { font-size: 12px; font-weight: bold; text-anchor: middle; }
    .sub   { font-size: 12px; font-style: italic; text-anchor: middle; }
  </style>

  <!-- Host-parasite pair -->
  <rect class="box" x="300" y="20" width="200" height="40"/>
  <text class="title" x="400" y="45">Host–parasite pair</text>

  <path class="line"  d="M 400 60 V 80 H 200"/>
  <path class="line"  d="M 400 80 H 600"/>
  <path class="arrow" d="M 200 80 V 100"/>
  <path class="arrow" d="M 600 80 V 100"/>

  <!-- Proteomes -->
  <rect class="box" x="70" y="100" width="260" height="46"/>
  <text class="title" x="200" y="120">Host proteome</text>
  <text class="txt"   x="200" y="137">STRING</text>

  <rect class="box" x="470" y="100" width="260" height="46"/>
  <text class="title" x="600" y="120">Parasite proteome</text>
  <text class="txt"   x="600" y="137">STRING</text>

  <!-- Host: TISSUES filter -->
  <path class="arrow" d="M 200 146 V 172"/>
  <rect class="filt" x="70" y="172" width="260" height="60"/>
  <text class="title" x="200" y="192">TISSUES filter</text>
  <text class="txt"   x="200" y="209">Keep host proteins expressed in</text>
  <text class="txt"   x="200" y="224">the tissues the parasite infects</text>

  <!-- Host: DeepLoc filter -->
  <path class="arrow" d="M 200 232 V 258"/>
  <rect class="filt" x="70" y="258" width="260" height="112"/>
  <text class="title" x="200" y="278">DeepLoc filter</text>
  <text class="sub"   x="200" y="298">Intracellular parasite</text>
  <text class="txt"   x="200" y="313">cytoplasm, nucleus,</text>
  <text class="txt"   x="200" y="328">cell membrane, extracellular</text>
  <text class="sub"   x="200" y="348">Extracellular parasite</text>
  <text class="txt"   x="200" y="363">cell membrane, extracellular</text>

  <!-- Parasite: DeepLoc filter -->
  <path class="arrow" d="M 600 146 V 258"/>
  <rect class="filt" x="470" y="258" width="260" height="112"/>
  <text class="title" x="600" y="278">DeepLoc filter</text>
  <text class="sub"   x="600" y="298">Multicellular parasite</text>
  <text class="txt"   x="600" y="313">extracellular</text>
  <text class="sub"   x="600" y="348">Unicellular parasite</text>
  <text class="txt"   x="600" y="363">extracellular, cell membrane</text>

  <!-- Merge -->
  <path class="line"  d="M 200 370 V 396 H 600 V 370"/>
  <path class="arrow" d="M 400 396 V 420"/>

  <!-- Orthology transfer -->
  <rect class="box" x="130" y="420" width="540" height="108"/>
  <text class="title" x="400" y="441">Orthology transfer</text>
  <text class="txt"   x="400" y="460">Host and parasite proteins are assigned to EggNOG orthologous groups.</text>
  <text class="txt"   x="400" y="476">A STRING interaction between a host group and a parasite group</text>
  <text class="txt"   x="400" y="492">(experimental or database score ≥ 0.7) is transferred to their member proteins.</text>
  <text class="txt"   x="400" y="508">Each predicted pair is scored by the average of the experimental and database scores.</text>

  <!-- Output -->
  <path class="arrow" d="M 400 528 V 554"/>
  <rect class="out" x="270" y="554" width="260" height="46"/>
  <text class="title" x="400" y="582">Predicted host–parasite PPIs</text>
</svg>
