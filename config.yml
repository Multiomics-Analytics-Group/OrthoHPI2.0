# Taxonomic group of each parasite (the `group` key below), and the colour used
# for it in the home page circos plot. `color` on a parasite stays its own
# identity colour in the network view; `group` is the coarser clade colouring.
# The palette is the Okabe-Ito colourblind-safe set, with its yellow darkened so
# the arcs stay visible on white.
parasite_groups:
    Nematoda: "#0072B2"
    Trematoda: "#D55E00"
