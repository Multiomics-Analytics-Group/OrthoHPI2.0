# `group` (optional) collapses several host species into one option in the app;
# hosts without it are their own group. Rat and mouse are grouped as Rodent: the
# Parasites_db curation only records rat hosts, and we assume the same parasites
# infect mouse (see the `hosts` lists of the parasites below).
hosts:
    9606:
        label: Homo sapiens
        color: "#525252"
        tissues_url: https://download.jensenlab.org/human_tissue_experiments_full.tsv
    10116:
        label: Rattus norvegicus
        group: Rodent
        color: "#1b7837"
        tissues_url: https://download.jensenlab.org/rat_tissue_experiments_full.tsv
    10090:
        label: Mus musculus
        group: Rodent
        color: "#1b7837"
        tissues_url: https://download.jensenlab.org/mouse_tissue_experiments_full.tsv
    9823:
        label: Sus scrofa
        color: "#762a83"
        tissues_url: https://download.jensenlab.org/pig_tissue_experiments_full.tsv

