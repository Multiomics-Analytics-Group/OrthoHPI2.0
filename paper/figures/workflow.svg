  <g transform="translate(0 49)"><g fill="#bddaeb" stroke="#0072B2" stroke-width="1.2" id="g98">
    <circle cx="846" cy="186" r="5" id="circle83" />
    <circle cx="850" cy="214" r="5" id="circle84" />
    <circle cx="862" cy="172" r="5" id="circle85" />
